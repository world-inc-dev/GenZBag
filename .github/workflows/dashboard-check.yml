name: GenZBag JavaScript syntax check
on:
  push:
    branches:
      - main
      - stateflix-style-dashboard
  pull_request:
    branches:
      - main
      - stateflix-style-dashboard
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check profile markup and unique IDs
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path

          class IdCheck(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == "id" and value:
                          self.ids.append(value)

          parser = IdCheck()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          duplicates = [name for name, count in Counter(parser.ids).items() if count > 1]
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          required = {
              "profileRefreshButton", "profileActivationCard", "profileReferralLink",
              "profileTotalReferrals", "profileActiveReferrals", "profileInactiveReferrals",
              "profileWhatsAppForm", "profilePasswordForm"
          }
          missing = sorted(required - set(parser.ids))
          if missing:
              raise SystemExit("Missing Accounts/Profile elements: " + ", ".join(missing))
          print("Accounts/Profile markup checks passed.")
          PY
      - name: Check inline application scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.items = []
                  self.current = None
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      if "src" not in attrs and attrs.get("type", "").lower() not in ("application/json", "application/ld+json"):
                          self.current = []
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.items.append("".join(self.current))
                      self.current = None
          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          scripts = [s for s in parser.items if s.strip()]
          if not scripts:
              raise SystemExit("No inline application scripts found")
          for i, script in enumerate(scripts):
              Path(f"/tmp/genzbag-app-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline application scripts.")
          PY
          for script in /tmp/genzbag-app-*.js; do node --check "$script"; done
