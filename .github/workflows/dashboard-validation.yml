name: GenZBag dashboard validation
on:
  push:
    branches:
      - stateflix-style-dashboard
  pull_request:
    branches:
      - stateflix-style-dashboard
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dashboard JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">(.*?)</script>', html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one module script, found {len(scripts)}")
          Path("/tmp/genzbag-dashboard.mjs").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/genzbag-dashboard.mjs
